<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설문 참여</title>
  <style>
    :root {
      --primary: #4a5fc1;
      --primary-dark: #3a4aa0;
      --bg: #f4f6fb;
      --text: #222;
      --nav-h: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--nav-h); }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ===== 네비게이션 바 ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      z-index: 1000;
    }
    .nav-inner {
      max-width: 1000px; height: 100%;
      margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { color: #fff; font-size: 1.2rem; font-weight: 700; text-decoration: none; }
    .nav-menu { display: flex; gap: 6px; list-style: none; }
    .nav-menu a {
      color: #fff; text-decoration: none;
      padding: 8px 14px; border-radius: 6px;
      transition: background .2s;
    }
    .nav-menu a:hover { background: var(--primary-dark); }
    .nav-menu a.external::after { content: " ↗"; font-size: .85em; }

    /* 모바일 햄버거 메뉴 */
    .menu-toggle {
      display: none; background: none; border: none;
      color: #fff; font-size: 1.6rem; cursor: pointer;
    }
    @media (max-width: 640px) {
      .menu-toggle { display: block; }
      .nav-menu {
        display: none;
        position: absolute; top: var(--nav-h); left: 0; right: 0;
        flex-direction: column; gap: 0;
        background: var(--primary);
        padding: 8px 0;
      }
      .nav-menu.open { display: flex; }
      .nav-menu a { display: block; padding: 12px 20px; border-radius: 0; }
    }

    /* ===== 본문 ===== */
    main { max-width: 1000px; margin: 0 auto; padding: calc(var(--nav-h) + 30px) 20px 40px; }
    section {
      background: #fff; border-radius: 12px;
      padding: 30px; margin-bottom: 30px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    h2 { font-size: 1.4rem; margin-bottom: 16px; color: var(--primary); }
    p { margin-bottom: 12px; }

    .btn {
      display: inline-block;
      background: var(--primary); color: #fff;
      padding: 12px 24px; border-radius: 8px;
      text-decoration: none; font-weight: 600;
      transition: background .2s, transform .1s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: scale(.98); }

    /* 구글폼 임베드 */
    .form-wrapper {
      width: 100%;
      border-radius: 8px; overflow: hidden;
      border: 1px solid #e2e5ee;
    }
    .form-wrapper iframe {
      width: 100%; height: 1200px; border: 0; display: block;
    }
    @media (max-width: 640px) {
      .form-wrapper iframe { height: 1500px; }
      section { padding: 20px; }
    }

    footer { text-align: center; color: #888; font-size: .9rem; padding: 20px; }
  </style>
</head>
<body>

  <!-- 네비게이션 바 -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="#home" class="logo">설문 페이지</a>
      <button class="menu-toggle" aria-label="메뉴 열기" onclick="toggleMenu()">☰</button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="#home" onclick="closeMenu()">홈</a></li>
        <li><a href="#form" onclick="closeMenu()">설문 작성</a></li>
        <li>
          <a class="external"
             href="https://docs.google.com/forms/d/e/1FAIpQLSfgN9QmoK0UMrHUbvPix1mukzqN0YO39rQSMQ8mhsN_LQAm0A/viewform?usp=header"
             target="_blank" rel="noopener noreferrer">새 창으로 열기</a>
        </li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- 소개 -->
    <section id="home">
      <h1>설문에 참여해 주세요</h1>
      <p>아래에서 바로 설문을 작성하거나, 새 창에서 구글폼을 열어 작성할 수 있습니다.</p>
      <a class="btn"
         href="https://docs.google.com/forms/d/e/1FAIpQLSfgN9QmoK0UMrHUbvPix1mukzqN0YO39rQSMQ8mhsN_LQAm0A/viewform?usp=header"
         target="_blank" rel="noopener noreferrer">새 창에서 설문 열기 ↗</a>
    </section>

    <!-- 임베드된 구글폼 -->
    <section id="form">
      <h2>설문 작성</h2>
      <div class="form-wrapper">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSfgN9QmoK0UMrHUbvPix1mukzqN0YO39rQSMQ8mhsN_LQAm0A/viewform?embedded=true"
          title="구글 설문지"
          loading="lazy">로드 중…</iframe>
      </div>
    </section>
  </main>

  <footer>© 2026 설문 페이지</footer>

  <script>
    function toggleMenu() {
      document.getElementById('navMenu').classList.toggle('open');
    }
    function closeMenu() {
      document.getElementById('navMenu').classList.remove('open');
    }
  </script>
</body>
</html>
